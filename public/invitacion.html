:root{--ter:#843D25;--alg:#EFECE8;--alg2:#E5E0D8;--luz:#F6DDBF;--t:1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Fustat';color:var(--ter);background:radial-gradient(120% 90% at 70% 0%,#F6DDBF 0%,#EFE3D6 50%,#E6DCCF 100%) fixed;
  -webkit-font-smoothing:antialiased;font-kerning:normal;overflow-x:hidden}
.paper{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .52 0 0 0 0 .40 0 0 0 0 .30 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.stage{min-height:100svh;display:grid;place-items:center;padding:28px 16px;position:relative}
/* ---------- sobre ---------- */
.envwrap{display:flex;flex-direction:column;align-items:center;gap:22px;transition:transform .8s cubic-bezier(.6,0,.3,1) 1.7s,opacity .7s ease 1.75s}
.env{--w:min(88vw,440px);width:var(--w);height:calc(var(--w)*.68);position:relative;perspective:1400px;cursor:pointer;
  filter:drop-shadow(0 18px 26px rgba(90,45,25,.20)) drop-shadow(0 3px 5px rgba(90,45,25,.12));-webkit-tap-highlight-color:transparent}
.env:focus-visible{outline:2px solid var(--ter);outline-offset:10px;border-radius:6px}
.back,.front,.flap,.inner{position:absolute}
.back{inset:0;background-color:var(--alg2);border-radius:6px}
.inner{left:6%;right:6%;top:8%;height:84%;background:#fff;border-radius:4px;display:grid;place-items:start center;padding-top:9%;
  transition:transform .8s cubic-bezier(.3,.7,.2,1) 1.0s;z-index:2;box-shadow:0 1px 4px rgba(90,45,25,.12)}
.inner img{width:56%}
.front{inset:0;z-index:3;border-radius:6px;background-color:var(--alg);
  clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.front::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(0,0,0,0) 40%,rgba(120,70,40,.07))}
.flap{left:0;right:0;top:0;height:62%;z-index:4;transform-origin:50% 0;transform-style:preserve-3d;
  transition:transform .75s cubic-bezier(.5,0,.2,1) .3s,z-index 0s linear .95s}
.flap i{position:absolute;inset:0;background-color:#F3F0EC;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden}
.flap i.b{background-color:#E9E3DB;transform:rotateY(180deg) rotateZ(180deg) scaleX(-1);transform:rotateX(180deg)}
.seal{position:absolute;left:50%;top:62%;width:clamp(62px,19vw,84px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:5;
  transition:opacity .45s ease .05s,transform .5s ease}
.seal span{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#A04E31 0%,#843D25 46%,#6E311D 100%);
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.06),inset 0 -3px 6px rgba(0,0,0,.18),0 3px 6px rgba(70,30,15,.35);
  transition:transform .55s cubic-bezier(.4,0,.2,1)}
.seal span:nth-child(1){clip-path:polygon(0 0,58% 0,44% 38%,56% 62%,42% 100%,0 100%)}
.seal span:nth-child(2){clip-path:polygon(58% 0,100% 0,100% 100%,42% 100%,56% 62%,44% 38%)}

.seal span.w{clip-path:none;transition:opacity .12s}
.open .seal span.w{opacity:0}
.hint{font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;opacity:.75;transition:opacity .3s}
.para{font-weight:300;font-size:clamp(22px,6.4vw,30px);letter-spacing:-.01em;text-align:center;max-width:88vw;overflow-wrap:anywhere}
/* abierto */
.open .seal{opacity:0}
.open .seal span:nth-child(1){transform:translate(-16%,10%) rotate(-14deg)}
.open .seal span:nth-child(2){transform:translate(16%,12%) rotate(12deg)}
.open .flap{transform:rotateX(180deg);z-index:1}
.open .inner{transform:translateY(-58%)}
.open .seal span.w{clip-path:none;transition:opacity .12s}
.open .seal span.w{opacity:0}
.hint{opacity:0}
.open .envwrap{transform:translateY(38vh);opacity:0}
/* ---------- tarjeta ---------- */
.card{position:absolute;left:50%;top:28px;width:min(92vw,460px);transform:translate(-50%,40px) scale(.9);opacity:0;pointer-events:none;
  background:#fff;border-radius:6px;padding:34px 28px 26px;box-shadow:0 22px 50px rgba(90,45,25,.18),0 2px 6px rgba(90,45,25,.08);
  transition:transform .9s cubic-bezier(.2,.8,.2,1) 1.85s,opacity .7s ease 1.85s;margin-bottom:28px}
.open .card{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.card .logo{display:block;width:62%;margin:0 auto 30px}
.k{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;text-align:center;margin-bottom:10px}
h1{font-weight:300;font-size:clamp(34px,10vw,44px);line-height:1.02;letter-spacing:-.02em;text-align:center;margin-bottom:18px}
.inv{font-size:17px;line-height:1.4;text-align:center;font-weight:400;margin-bottom:18px}
.inv .l1{font-weight:600;font-size:19px}
.nm{text-align:center;font-weight:300;font-size:21px;margin-bottom:4px}
.dt{text-align:center;border-top:1px solid rgba(132,61,37,.25);border-bottom:1px solid rgba(132,61,37,.25);padding:14px 0;margin-bottom:14px}
.dt .d{font-weight:600;font-size:19px}
.dt .a{font-size:15px;margin-top:4px}
.calm{text-align:center;font-weight:300;font-size:16px;margin:4px 0 20px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.btn{font:inherit;font-weight:600;font-size:14.5px;border-radius:999px;padding:12px 10px;text-align:center;text-decoration:none;cursor:pointer;
  border:1.5px solid var(--ter);background:transparent;color:var(--ter);display:block}
.btn.pri{background:var(--ter);color:#fff}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ter);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* formulario */
form{background:var(--alg);border-radius:6px;padding:20px 18px}
form h2{font-weight:600;font-size:18px;margin-bottom:12px}
label.f{display:block;font-size:13px;font-weight:500;margin:12px 0 6px}
input[type=text],input[type=tel],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ter);background:#fff;border:1px solid rgba(132,61,37,.35);
  border-radius:8px;padding:11px 12px}
textarea{min-height:70px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:block;text-align:center;border:1.5px solid var(--ter);border-radius:999px;padding:10px 6px;font-size:14.5px;font-weight:600;cursor:pointer;background:#fff}
.seg input:checked+label{background:var(--ter);color:#fff}
.seg input:focus-visible+label{outline:2px solid var(--ter);outline-offset:2px}
.cnt{display:flex;align-items:center;gap:12px}
.cnt button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ter);background:#fff;color:var(--ter);font:inherit;font-size:20px;font-weight:600;cursor:pointer}
.cnt output{font-weight:700;font-size:20px;min-width:24px;text-align:center}
.rg{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.35;margin-top:14px}
.rg input{margin-top:2px;width:18px;height:18px;accent-color:var(--ter);flex:none}
.rg a{color:var(--ter)}
.bad{border-color:#B3261E!important;box-shadow:0 0 0 1px #B3261E}label.rg.bad{box-shadow:none;color:#8a2a12}
.fe{font-size:13px;color:#8a2a12;margin:6px 0 0}
.err{font-size:13px;color:#8a2a12;margin-top:10px;min-height:1em}
.send{margin-top:14px;width:100%}
.note{font-size:12px;opacity:.75;margin-top:8px;text-align:center}
.thanks{display:none;text-align:center;background:var(--alg);border-radius:6px;padding:26px 18px}
.thanks h2{font-weight:300;font-size:30px;line-height:1.05;margin-bottom:10px}
.thanks p{font-size:16px;line-height:1.4}
.acts{display:grid;gap:8px;margin:2px 0 6px}
.btn.big{font-size:16.5px;padding:15px 12px;box-shadow:0 6px 16px rgba(132,61,37,.25)}
.btn.txt{border-color:transparent;font-weight:500;text-decoration:underline;text-underline-offset:3px;font-size:14.5px;padding:8px}
.done .acts{display:none}
.btns.tb{margin:18px auto 0;gap:10px;grid-template-columns:1fr;max-width:300px}.btns.tb .btn{background:#fff}.btns.tb .btn.pri{background:var(--ter);color:#fff}
.thanks.nob .btns.tb{display:none}.done .thanks{display:block}
.veil{position:fixed;inset:0;background:rgba(60,28,16,.35);opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92svh;overflow:auto;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);
  background:var(--alg);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(60,28,16,.25);padding-bottom:env(safe-area-inset-bottom)}
.sheet form{background:transparent;max-width:520px;margin:0 auto;padding:22px 20px 24px;position:relative}
.sheet form::before{content:"";display:block;width:44px;height:4px;border-radius:4px;background:rgba(132,61,37,.3);margin:-8px auto 14px}
.x{position:absolute;right:12px;top:8px;width:38px;height:38px;border:0;background:none;color:var(--ter);font:inherit;font-size:28px;line-height:1;cursor:pointer}
.ask .veil{opacity:1;pointer-events:auto}.ask .sheet{transform:none}
.no #pers{display:none}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(92vw,500px);border-radius:10px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;
    transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
  .ask .sheet{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet form::before{display:none}}
footer{margin-top:18px;text-align:center;font-size:11px;letter-spacing:.06em;opacity:.8}
.replay{display:block;margin:14px auto 0;background:none;border:0;font:inherit;font-size:12.5px;color:var(--ter);text-decoration:underline;cursor:pointer;opacity:.8}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:0s!important;transition-delay:0s!important;animation:none!important}}
@media (min-width:900px){.stage{padding:48px}.card{top:48px}}
</style>
</head>

<script>
(function(){
  const $ = id => document.getElementById(id);
  // --- nombre desde ?para= (saneado; siempre textContent) ---
  let nombre = '';
  try { nombre = new URLSearchParams(location.search).get('para') || ''; } catch(e) {}
  nombre = nombre.replace(/[\u0000-\u001F\u007F<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 40);
  $('para').textContent = nombre ? 'Para ' + nombre : 'Para ti';
  if (nombre) $('nm').textContent = nombre + ','; else $('nm').remove();
  $('f-nombre').value = nombre;
  const horaTxt = CONFIG.HORA ? CONFIG.HORA + ' h' : '[HORA]';
  $('fecha').textContent = 'Jueves 29 de octubre · ' + horaTxt;
  $('dir').textContent = CONFIG.DIRECCION;
  if (CONFIG.REGISTRO) $('reg').textContent = 'N.º de registro sanitario: ' + CONFIG.REGISTRO; else $('reg').remove();
  $('maps').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(CONFIG.MAPS_QUERY);
  if (CONFIG.PRIVACIDAD_URL) { const a = document.createElement('a'); a.href = CONFIG.PRIVACIDAD_URL; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Política de privacidad'; $('priv').appendChild(a); }
  else $('priv').textContent = '[enlace política de privacidad]';
  if (!CONFIG.JOTFORM_FORM_ID) $('pend').classList.remove('hidden');

  // --- abrir ---
  const open = () => { if (!document.body.classList.contains('open')) { document.body.classList.add('open'); setTimeout(() => $('card').focus && $('card').setAttribute('tabindex','-1'), 2600); } };
  $('env').addEventListener('click', open);
  $('env').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  $('replay').addEventListener('click', () => { document.body.classList.remove('open'); window.scrollTo({top:0}); });

  // --- calendario (.ics generado en el navegador) ---
  const pad = n => String(n).padStart(2, '0');
  $('ics').addEventListener('click', () => {
    const [y, m, d] = CONFIG.FECHA.split('-').map(Number);
    let when;
    if (CONFIG.HORA) {
      const [hh, mm] = CONFIG.HORA.split(':').map(Number);
      const start = new Date(Date.UTC(y, m - 1, d, hh, mm) - CONFIG.UTC_OFFSET_MIN * 60000);
      const end = new Date(start.getTime() + CONFIG.DURACION_HORAS * 3600000);
      const z = t => t.getUTCFullYear() + pad(t.getUTCMonth() + 1) + pad(t.getUTCDate()) + 'T' + pad(t.getUTCHours()) + pad(t.getUTCMinutes()) + '00Z';
      when = 'DTSTART:' + z(start) + '\r\nDTEND:' + z(end);
    } else {
      const n = new Date(Date.UTC(y, m - 1, d + 1));
      when = 'DTSTART;VALUE=DATE:' + y + pad(m) + pad(d) + '\r\nDTEND;VALUE=DATE:' + n.getUTCFullYear() + pad(n.getUTCMonth() + 1) + pad(n.getUTCDate());
    }
    const now = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Goodview Centro Optico//Invitacion//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
      'UID:inauguracion-goodview-20261029@goodview', 'DTSTAMP:' + now, when,
      'SUMMARY:Inauguración de Goodview Centro Óptico', 'LOCATION:' + CONFIG.DIRECCION.replace(/,/g, '\\,'),
      'DESCRIPTION:Sin prisas. Te esperamos.', 'END:VEVENT','END:VCALENDAR'].join('\r\n');
    const blob = new Blob([ics], {type: 'text/calendar;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'inauguracion-goodview.ics';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });

  // --- confirmación: «Confirmo asistencia» (Sí) / «No podré asistir» (No) ---
  let modo = 'si', lastBtn = null;
  const getPersonas = () => { const r = document.querySelector('input[name=personas]:checked'); return r && r.value === '2' ? 2 : 1; };   // solo 1 o 2
  const abrir = (m, btn) => {
    modo = m; lastBtn = btn; document.body.classList.toggle('no', m === 'no');
    $('f-title').textContent = m === 'si' ? 'Confirma tu asistencia' : '¿No podrás venir?';
    $('l-com').textContent = m === 'si' ? 'Comentario (opcional)' : '¿Quieres dejarnos un mensaje? (opcional)';
    $('send').textContent = m === 'si' ? 'Enviar confirmación' : 'Enviar';
    $('err').textContent = ''; document.body.classList.add('ask'); $('sheet').setAttribute('aria-hidden', 'false');
    setTimeout(() => $('f-nombre').focus({preventScroll: true}), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 380);
  };
  const cerrar = () => { document.body.classList.remove('ask'); $('sheet').setAttribute('aria-hidden', 'true'); lastBtn && lastBtn.focus(); };
  $('b-si').onclick = e => abrir('si', e.currentTarget); $('b-no').onclick = e => abrir('no', e.currentTarget);
  $('cerrar').onclick = cerrar; $('veil').onclick = cerrar;
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('ask')) cerrar(); });
  // Validación propia (sin «required» nativo) con error junto a cada campo
  const marca = (el, msg) => { const box = el.closest('label.rg') || el; box.classList.add('bad');
    const m = document.createElement('p'); m.className = 'fe'; m.textContent = msg; box.insertAdjacentElement('afterend', m); };
  const limpia = () => { document.querySelectorAll('.bad').forEach(x => x.classList.remove('bad')); document.querySelectorAll('.fe').forEach(x => x.remove()); $('err').textContent = ''; };
  let enviando = false;
  let fallo = () => { $('err').textContent = 'No hemos podido enviar tu respuesta. Inténtalo de nuevo.'; };
  const enviar = e => { try {
    if (e) e.preventDefault();
    if (enviando) return;
    limpia();
    const nom = $('f-nombre').value.replace(/[\u0000-\u001F\u007F<>]/g, '').replace(/\s+/g, ' ').trim();
    const tel = $('f-tel').value.trim();
    const telOk = /^[+0-9 ().-]{9,20}$/.test(tel) && tel.replace(/\D/g, '').length >= 9;
    const errores = [];
    if (!nom) errores.push([$('f-nombre'), 'Escribe tu nombre y apellidos.']);
    if (!telOk) errores.push([$('f-tel'), 'Escribe un teléfono de al menos 9 cifras.']);
    if (!$('f-rgpd').checked) errores.push([$('f-rgpd'), 'Marca la casilla para que podamos guardar tu respuesta.']);
    if (errores.length) {
      errores.forEach(([el, m]) => marca(el, m));
      $('err').textContent = 'Revisa los campos marcados.';
      const first = errores[0][0]; first.scrollIntoView({block: 'center', behavior: 'smooth'}); setTimeout(() => first.focus({preventScroll: true}), 250);
      return;
    }
    const si = modo === 'si';
    const personas = si ? getPersonas() : 0;
    if (si && personas !== 1 && personas !== 2) { $('err').textContent = 'Elige «Solo yo» o «Yo + 1 acompañante».'; return; }
    const data = {nombre: nom, asistencia: si ? 'Sí, allí estaré' : 'No podré ir', personas: String(personas), telefono: tel,
                  comentario: $('f-com').value.trim(), rgpd: 'Acepto', invitado: nombre || '(sin nombre en el enlace)'};
    let hecho = false;
    const fin = () => {
      if (hecho) return; hecho = true;
      const pila = nom.split(' ')[0];
      $('th-h').textContent = si ? '¡Gracias, ' + pila + '!' : 'Gracias por avisarnos, ' + pila + '.';
      $('th-p').textContent = si ? 'Te esperamos el jueves 29 a las ' + (CONFIG.HORA || '[HORA]') + '.' + (personas === 2 ? ' Contamos contigo y con tu acompañante.' : '')
                                 : 'Te esperamos cuando quieras.';
      $('thanks').classList.toggle('nob', !si);
      document.body.classList.remove('ask'); $('sheet').setAttribute('aria-hidden', 'true');
      $('card').classList.add('done'); $('thanks').focus({preventScroll: true});
      $('thanks').scrollIntoView({behavior: 'smooth', block: 'center'});
    };
    if (!CONFIG.JOTFORM_FORM_ID) { fin(); return; }   // modo pendiente: no se envía nada
    if (!si) delete data.personas;   // con «No» no se envía número de personas (el campo admite solo 1–2)
    const ID = CONFIG.JOTFORM_FORM_ID, URL_ENVIO = 'https://submit.jotform.com/submit/' + encodeURIComponent(ID);
    const campos = [['formID', ID], ['simple_spc', ID + '-' + ID], ['submitSource', 'form'], ['submitDate', String(Date.now())]];   // antispam de Jotform
    for (const k in data) if (CONFIG.JOTFORM_CAMPOS[k]) campos.push([CONFIG.JOTFORM_CAMPOS[k], data[k]]);
    // enlace de respaldo: formulario de Jotform con los datos ya rellenos (q2_textbox0 -> textbox0, etc.)
    const respaldo = () => { const u = new URLSearchParams(); for (const [k, v] of campos) { const m = k.match(/^q\d+_(?:q\d+_)?(.+)$/); if (m) u.append(m[1].replace('[]', ''), v); }
      return 'https://form.jotform.com/' + encodeURIComponent(ID) + '?' + u.toString(); };
    fallo = () => {
      $('send').disabled = false; $('send').textContent = si ? 'Enviar confirmación' : 'Enviar';
      $('err').textContent = 'No hemos podido enviar tu respuesta desde aquí. ';
      const a = document.createElement('a'); a.href = respaldo(); a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Envíala desde este formulario'; a.style.color = 'inherit';
      $('err').appendChild(a); $('err').appendChild(document.createTextNode(' (tus datos ya van rellenos).'));
    };
    // envío 1: el formulario oculto dentro de un iframe (si el entorno no lo bloquea)
    const viaIframe = () => { try {
      const f = document.createElement('form'); f.method = 'POST'; f.action = URL_ENVIO; f.target = 'jf'; f.acceptCharset = 'utf-8'; f.className = 'hidden';
      for (const [k, v] of campos) { const i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = v; f.appendChild(i); }
      document.body.appendChild(f); f.submit(); return true; } catch (err) { return false; } };
    $('send').disabled = true; $('send').textContent = 'Enviando…'; $('err').textContent = '';
    // envío 2 (principal): fetch POST sin CORS. Funciona en file://, en vistas previas con sandbox, en Safari y en navegadores de apps.
    // Solo se usa uno de los dos para no duplicar la respuesta: fetch primero; el iframe solo si fetch no existe o falla.
    (async () => {
      let ok = false;
      if (window.fetch) {
        try { await fetch(URL_ENVIO, {method: 'POST', mode: 'no-cors', body: new URLSearchParams(campos), credentials: 'omit', keepalive: true}); ok = true; }
        catch (err) { ok = false; }
      }
      if (!ok) ok = viaIframe();
      if (ok) fin(); else { enviando = false; fallo(); }
    })();
    enviando = true;
  } catch (err) { enviando = false; try { fallo(); } catch (e2) { $('err').textContent = 'No hemos podido enviar tu respuesta. Escríbenos o inténtalo de nuevo.'; } } };
  $('send').addEventListener('click', enviar);
  $('form').addEventListener('submit', enviar);
})();
</script>
</body>
</html>
