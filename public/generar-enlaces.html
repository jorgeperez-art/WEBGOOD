<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Enlaces de invitación · Goodview</title>
<style>
:root{--ter:#843D25;--alg:#EFECE8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Fustat',system-ui,sans-serif;color:var(--ter);background:var(--alg);padding:28px 16px}
main{max-width:560px;margin:0 auto}
h1{font-weight:300;font-size:32px;margin-bottom:8px}
p.i{font-size:15px;line-height:1.4;margin-bottom:18px}
textarea{width:100%;min-height:140px;font:inherit;font-size:16px;color:var(--ter);background:#fff;border:1px solid rgba(132,61,37,.35);border-radius:8px;padding:11px 12px}
ul{list-style:none;margin-top:18px;display:grid;gap:10px}
li{background:#fff;border-radius:10px;padding:12px 14px;display:grid;gap:8px}
li b{font-size:17px}
li code{font-size:12.5px;word-break:break-all;opacity:.8}
.r{display:flex;gap:8px;flex-wrap:wrap}
a.btn,button.btn{font:inherit;font-weight:600;font-size:14px;border-radius:999px;padding:9px 14px;border:1.5px solid var(--ter);background:var(--ter);color:#fff;text-decoration:none;cursor:pointer}
button.btn{background:#fff;color:var(--ter)}
</style>
</head>
<body>
<main>
  <h1>Enlaces de invitación</h1>
  <p class="i">Escribe un nombre por línea. Cada invitado recibe su enlace personal; pulsa «Enviar por WhatsApp» y elige el contacto.</p>
  <textarea id="nombres" placeholder="María&#10;Juan y Lucía"></textarea>
  <ul id="lista"></ul>
</main>
<script>
(function(){
  const BASE = 'https://www.goodview.es/invitacion';
  const ta = document.getElementById('nombres'), ul = document.getElementById('lista');
  try { ta.value = localStorage.getItem('gv-invitados') || ''; } catch (e) {}
  const pinta = () => {
    try { localStorage.setItem('gv-invitados', ta.value); } catch (e) {}
    ul.textContent = '';
    ta.value.split('\n').map(n => n.replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 40)).filter(Boolean).forEach(n => {
      const url = BASE + '?para=' + encodeURIComponent(n);
      const texto = 'Hola ' + n + ', tienes una invitación de Goodview Centro Óptico: ' + url;
      const li = document.createElement('li');
      const b = document.createElement('b'); b.textContent = n;
      const c = document.createElement('code'); c.textContent = url;
      const r = document.createElement('div'); r.className = 'r';
      const wa = document.createElement('a'); wa.className = 'btn'; wa.target = '_blank'; wa.rel = 'noopener';
      wa.href = 'https://wa.me/?text=' + encodeURIComponent(texto); wa.textContent = 'Enviar por WhatsApp';
      const cp = document.createElement('button'); cp.className = 'btn'; cp.type = 'button'; cp.textContent = 'Copiar enlace';
      cp.onclick = () => navigator.clipboard.writeText(url).then(() => { cp.textContent = 'Copiado'; setTimeout(() => cp.textContent = 'Copiar enlace', 1500); });
      r.append(wa, cp); li.append(b, c, r); ul.appendChild(li);
    });
  };
  ta.addEventListener('input', pinta); pinta();
})();
</script>
</body>
</html>
